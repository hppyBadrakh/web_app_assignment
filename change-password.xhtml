<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="mn" lang="mn">
<head>
  <title>TestHub - Нууц үг солих</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" type="text/css" href="global.css" />
</head>
<body>

  <!-- NAVBAR same as profile.xhtml -->

  <div class="container">
    <div class="page-header">
      <h1>Нууц үг солих</h1>
      <p>Нууц үгээ аюулгүй аргаар солих</p>
    </div>

    <div class="profile-layout">
      <div class="profile-sidebar brutal">
        <a href="profile.xhtml" class="profile-menu-btn">Профайлын тойм</a>
        <a href="test-history.xhtml" class="profile-menu-btn">Шалгалтын түүх</a>
        <a href="payment-info.xhtml" class="profile-menu-btn">Төлбөрийн мэдээлэл</a>
        <a href="change-password.xhtml" class="profile-menu-btn active">Нууц үг солих</a>
        <a href="#" class="profile-menu-btn logout">Гарах</a>
      </div>

      <div class="profile-main brutal">
        <h2>Нууц үг солих</h2>
        <form class="change-password-form" action="#" method="post">
          <label for="current-password">Одоо байгаа нууц үг:</label>
          <input type="password" id="current-password" name="current-password" />

          <label for="new-password">Шинэ нууц үг:</label>
          <input type="password" id="new-password" name="new-password" />

          <label for="confirm-password">Шинэ нууц үгийг давт:</label>
          <input type="password" id="confirm-password" name="confirm-password" />

          <button type="submit" class="btn-brutal green-btn">Нууц үг солих</button>
        </form>
      </div>
    </div>
  </div>

  <footer class="footer-gradient">
    <!-- footer content same as profile.xhtml -->
  </footer>

</body>
</html>
