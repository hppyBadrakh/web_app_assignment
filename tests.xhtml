<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="mn" lang="mn">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шалгалтууд - ЭШ-г эзэмш</title>
    <link rel="stylesheet" type="text/css" href="global.css" />
</head>

<body>
    <div class="navbar">
        <div class="container flex-row">
            <div class="logo-group">
                <div class="logo-icon">T</div>
                <span class="logo-text">TestHub</span>
            </div>
            <input type="checkbox" id="menu-checkbox" />
            <label for="menu-checkbox" class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <ul class="nav-menu">
                <li><a href="index.xhtml">Нүүр</a></li>
                <li><a href="tests.xhtml" class="btn-active">Шалгалтууд</a></li>
                <li class="has-drop">
                    <a href="competition.xhtml">Тэмцээн &#9662;</a>
                    <ul class="drop-menu">
                        <li><a href="competition.xhtml">Ирэх тэмцээнүүд</a></li>
                        <li><a href="competition.xhtml">Өнгөрсөн тэмцээнүүд</a></li>
                    </ul>
                </li>
                <li><a href="help.xhtml">Тусламж</a></li>
                <li class="user-profile">
                    <a href="profile.xhtml" class="avatar">&#128100;</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- PAGE HERO -->
    <div class="container">
        <div class="hero-area">
            <div class="banner brutal">
                <div class="banner-icon">&#128218;</div>
                <h1>ЭШ-г эзэмш</h1>
                <p>Шалгалтын загвар тестүүдийг хичээл, жилээр хайж үзээрэй. Зорилгодоо тохирох төгс бэлтгэлийн тестийг ол!</p>
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container">
        <div class="exams-layout">

            <!-- Sidebar Filters -->
            <div class="exams-sidebar">
                <h3>Шүүлтүүрүүд</h3>
                <div class="filter-group">
                    <h4>Сэдэв</h4>
                    <div class="checkbox-item">
                        <input type="checkbox" checked="checked" /> Математик
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" /> Монгол
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" /> Физик
                    </div>
                </div>
                <div class="filter-group">
                    <h4>Жил</h4>
                    <div class="checkbox-item">
                        <input type="checkbox" /> 2024
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" /> 2023
                    </div>
                </div>
            </div>

            <!-- Main Content — exam cards rendered dynamically by tests.js -->
            <div class="exams-content">
                <input type="text" id="exam-search" class="exams-search"
                       placeholder="Шалгалтуудыг сэдэв эсвэл жилээр хайна уу..." />

                <div id="exam-grid" class="exam-grid">&#160;</div>
            </div>

        </div>
    </div>

    <script type="text/javascript" src="components.js"></script>
    <script type="text/javascript" src="tests.js"></script>
</body>

</html>
